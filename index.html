<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Contador Web v8.9</title>

  <!-- Biblioteca para Geração Rápida de QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-tertiary-fixed": "#2d1600",
            "on-background": "#e2e2e5",
            "on-secondary": "#003919",
            "tertiary": "#ffb873",
            "outline-variant": "#414753",
            "error-container": "#93000a",
            "surface-bright": "#37393b",
            "surface-container-low": "#1a1c1e",
            "on-error-container": "#ffdad6",
            "on-tertiary": "#4b2800",
            "inverse-primary": "#005db8",
            "primary": "#a9c7ff",
            "tertiary-fixed-dim": "#ffb873",
            "on-secondary-container": "#003e1c",
            "secondary-fixed-dim": "#4de082",
            "surface-container": "#1e2022",
            "on-error": "#690005",
            "inverse-on-surface": "#2f3133",
            "tertiary-container": "#dc8000",
            "on-surface": "#e2e2e5",
            "on-secondary-fixed": "#00210c",
            "on-surface-variant": "#c1c6d5",
            "surface-container-lowest": "#0c0e10",
            "error": "#ffb4ab",
            "surface-container-high": "#282a2c",
            "secondary-fixed": "#6dfe9c",
            "surface-container-hover": "#333537",
            "primary-fixed": "#d6e3ff",
            "primary-container": "#4d96ff",
            "tertiary-fixed": "#ffdcbf",
            "on-tertiary-fixed-variant": "#6a3b00",
            "on-primary-fixed-variant": "#00468c",
            "outline": "#8b919e",
            "surface-tint": "#a9c7ff",

            "on-primary": "#003064",
            "secondary": "#4de082",
            "surface-variant": "#333537",
            "secondary-container": "#00b55d",
            "on-primary-container": "#002e61",
            "primary-fixed-dim": "#a9c7ff",
            "on-secondary-fixed-variant": "#005227",
            "on-tertiary-container": "#492700",
            "on-primary-fixed": "#001b3e",

  <style>
    :root {
      --qtd-colunas: 10;
    }

    body { font-family: 'Inter', sans-serif; }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    /* Estilos ativos dos cards */
    .card-active {
      background-color: rgba(0, 181, 93, 0.1) !important;
      border-color: #4de082 !important;
      box-shadow: 0px 4px 20px rgba(0, 181, 93, 0.15);
    }
    .text-active {
      color: #4de082 !important;
    }

    .glass-summary {
      background: rgba(30, 32, 34, 0.85);
      backdrop-filter: blur(12px);
    }

    /* Grid Dinâmico de Contadores baseado na variável CSS */
    .dynamic-grid {
      display: grid;
      grid-template-columns: repeat(var(--qtd-colunas), minmax(0, 1fr));
      gap: 1rem;
    }

    /* Responsividade para telas menores */
    @media (max-width: 1024px) {
      .dynamic-grid {
        grid-template-columns: repeat(min(var(--qtd-colunas), 4), minmax(0, 1fr));
      }
    }
    @media (max-width: 640px) {
      .dynamic-grid {
        grid-template-columns: repeat(min(var(--qtd-colunas), 2), minmax(0, 1fr));
      }
    }

    #comprovante-print { display: none; }

    /* Impressão Térmica */
    @media print {
      @page {
        size: auto;
        margin: 0mm 0mm 0mm 1mm;
      }

      body * { visibility: hidden; }
      #comprovante-print, #comprovante-print * { visibility: visible; }

      #comprovante-print {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        max-width: 80mm;
        padding: 2mm 4mm;
        zoom: 170%;
        transform-origin: top left;
        font-family: 'Courier New', Courier, monospace;
        font-size: 8pt;
        font-weight: 700;
        line-height: 1.15;
        white-space: pre;
        color: #000000 !important;
        background: #ffffff;
      }

      .qrcode-container {
        margin-top: 8px;
        width: 100%;
        text-align: center;
        display: block;
      }

      .qrcode-label {
        font-size: 8pt;
        margin-bottom: 4px;
        text-align: center;
        width: 100%;
      }

      #qrcode-target {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
      }

      #qrcode-target img {
        margin: 0 auto !important;
        display: block !important;
      }
    }
  </style>
</head>

  <!-- Div de Impressão -->
  <div id="comprovante-print"></div>

  <script>
    const URL_PROFISSIONAIS_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQRCSnS7sXbLE0_zzysCTqMOpKKP6x1U1P_ruWHK8hF3RGmOGcUYJK4DoMRYXQxlGjTR4uaeSes1c4u/pub?gid=0&single=true&output=csv";
    const URL_CONVENIOS_CSV     = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQRCSnS7sXbLE0_zzysCTqMOpKKP6x1U1P_ruWHK8hF3RGmOGcUYJK4DoMRYXQxlGjTR4uaeSes1c4u/pub?gid=2019437900&single=true&output=csv";

    let dados = {
      profissionais: { consulta: [], sadt: [] },
      convenios: { consulta: [], sadt: [] }
    };

    let tipoAtual = 'consulta';
    let valorAtual = 0.0;
    let contadores = {};

    let colunasAtuais = parseInt(localStorage.getItem('pref_colunas')) || 10;

    function aplicarColunas(qtd) {
      colunasAtuais = Math.min(Math.max(qtd, 2), 15);
      document.documentElement.style.setProperty('--qtd-colunas', colunasAtuais);
      
      const lbl = document.getElementById('lbl-colunas');
      if (lbl) lbl.innerText = colunasAtuais;
      
      localStorage.setItem('pref_colunas', colunasAtuais);
    }

    function alterarColunas(delta) {
      aplicarColunas(colunasAtuais + delta);
    }

    function debugLog(txt) {
      const box = document.getElementById('debug-box');
      if (box) {
        box.classList.remove('hidden');
        box.innerHTML += txt + "<br>";
      }
    }

    function parseCSVLine(line) {
      const separator = line.includes(';') ? ';' : ',';
      const result = [];
      let start = 0;
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        if (line[i] === '"') {
          inQuotes = !inQuotes;
        } else if (line[i] === separator && !inQuotes) {
          let field = line.substring(start, i).trim();
          if (field.startsWith('"') && field.endsWith('"')) {
            field = field.substring(1, field.length - 1);
          }
          result.push(field);
          start = i + 1;
        }
      }
      let lastField = line.substring(start).trim();
      if (lastField.startsWith('"') && lastField.endsWith('"')) {
        lastField = lastField.substring(1, lastField.length - 1);
      }
      result.push(lastField);
      return result;
    }

    async function carregarCSVTexto(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) throw new Error("Erro de rede ao buscar o CSV");
      const text = await response.text();
      const lines = text.split(/\r?\n/).filter(line => line.trim().length > 0);
      return lines.map(parseCSVLine);
    }

    async function sincronizarComPlanilha() {
      const statusEl = document.getElementById('status-sync');
      const debugEl = document.getElementById('debug-box');
      if (debugEl) debugEl.innerHTML = '';
      
      if (statusEl) {
        statusEl.innerText = "🔄 Sincronizando dados com o Google Sheets...";
        statusEl.className = "p-3 rounded-xl bg-surface-container text-center font-label-sm text-sm border border-outline-variant text-primary";
      }

      try {
        const [rowsProf, rowsConv] = await Promise.all([
          carregarCSVTexto(URL_PROFISSIONAIS_CSV),
          carregarCSVTexto(URL_CONVENIOS_CSV)
        ]);

        dados.profissionais = { consulta: [], sadt: [] };
        dados.convenios = { consulta: [], sadt: [] };

        debugLog(`${rowsProf.length} Profissionais Cadastrados`);

        for (let i = 1; i < rowsProf.length; i++) {
          const row = rowsProf[i];
          if (row.length >= 2) {
            const nome = row[0].trim();
            const tipo = row[1].toLowerCase().trim();

            if (nome && tipo) {
              if (tipo.includes('consulta')) dados.profissionais.consulta.push(nome);
              else if (tipo.includes('sadt')) dados.profissionais.sadt.push(nome);
              else debugLog(`⚠️ Profissional '${nome}' ignorado. Tipo encontrado: '${tipo}'`);
            }
          }
        }

        debugLog(`${rowsConv.length} Convênios Localizados`);

        for (let i = 1; i < rowsConv.length; i++) {
          const row = rowsConv[i];
          if (row.length >= 3) {
            const nome = row[0].trim();
            const valorRaw = row[1].trim();
            const tipo = row[2].toLowerCase().trim();

            if (nome && tipo) {
              const valorClean = valorRaw.replace('R$', '').replace(/\s/g, '').replace('.', '').replace(',', '.');
              const valorFormatado = parseFloat(valorClean) || 0.0;
              const objConv = { nome: nome, valor: valorFormatado };

              if (tipo.includes('consulta')) dados.convenios.consulta.push(objConv);
              else if (tipo.includes('sadt')) dados.convenios.sadt.push(objConv);
              else debugLog(`⚠️ Convênio '${nome}' ignorado. Tipo encontrado: '${tipo}'`);
            }
          }
        }

        const totalProf = dados.profissionais.consulta.length + dados.profissionais.sadt.length;
        if (totalProf === 0) {
          throw new Error("Nenhum profissional válido foi importado.");
        }

        localStorage.setItem('dados_sheets_cache', JSON.stringify(dados));
        
        if (statusEl) {
          statusEl.innerText = "🟢 Dados sincronizados - Banco de Dados Atualizado";
          statusEl.className = "p-3 rounded-xl bg-surface-container text-center font-label-sm text-sm border border-outline-variant text-secondary";
        }
      } catch (err) {
        console.error(err);
        debugLog(`❌ Erro: ${err.message}`);
        
        const cache = localStorage.getItem('dados_sheets_cache');
        if (cache) {
          dados = JSON.parse(cache);
          if (statusEl) {
            statusEl.innerText = "🟡 Conectado via cache local (Offline)";
            statusEl.className = "p-3 rounded-xl bg-surface-container text-center font-label-sm text-sm border border-outline-variant text-tertiary";
          }
        } else {
          if (statusEl) {
            statusEl.innerText = "🔴 Falha no formato da planilha. Veja os detalhes abaixo:";
            statusEl.className = "p-3 rounded-xl bg-surface-container text-center font-label-sm text-sm border border-outline-variant text-error";
          }
        }
      }
    }

    function navegar(idTela) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(idTela).classList.add('active');

      const headerControls = document.getElementById('header-controls');
      const summaryBar = document.getElementById('summary-bar');

      if (idTela === 'tela-contador') {
        headerControls.classList.remove('hidden');
        headerControls.classList.add('flex');
        summaryBar.classList.remove('hidden');
      } else {
        headerControls.classList.add('hidden');
        headerControls.classList.remove('flex');
        summaryBar.classList.add('hidden');
      }
    }

    function escolherTipo(tipo) {
      tipoAtual = tipo;
      document.getElementById('titulo-tipo').innerText = `Contador - ${tipo.toUpperCase()}`;
      carregarDropdownConvenios();
      iniciarContadores();
      navegar('tela-contador');
    }

    function carregarDropdownConvenios() {
      const select = document.getElementById('select-convenio');
      select.innerHTML = '<option value="">Selecione um convênio</option>';
      const lista = dados.convenios[tipoAtual] || [];
      
      lista.forEach((c, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = `${c.nome} | R$ ${parseFloat(c.valor).toFixed(2)}`;
        select.appendChild(opt);
      });
      valorAtual = 0.0;
      atualizarTotais();
    }

    function selecionarConvenio() {
      const idx = document.getElementById('select-convenio').value;
      if (idx !== "") {
        valorAtual = parseFloat(dados.convenios[tipoAtual][idx].valor);
      } else {
        valorAtual = 0.0;
      }
      atualizarTotais();
    }

    function iniciarContadores() {
      const grid = document.getElementById('grid-contadores');
      grid.innerHTML = '';
      contadores = {};
      const nomes = dados.profissionais[tipoAtual] || [];

      nomes.forEach(nome => {
        contadores[nome] = 0;
        const card = document.createElement('div');
        card.className = 'bg-surface-container-high border border-outline-variant rounded-xl p-4 flex flex-col gap-3 transition-all hover:border-primary hover:shadow-lg professional-card';
        card.id = `card-${nome}`;
        card.setAttribute('data-count', '0');
        
        card.innerHTML = `
          <span class="font-label-md text-xs text-on-surface-variant truncate font-bold text-center">${nome}</span>
          <div class="flex-grow flex items-center justify-center py-2">
            <span class="font-headline-xl text-3xl font-bold counter-value" id="qtd-${nome}">0</span>
          </div>
          <div class="flex justify-between items-center bg-surface-container-highest rounded-xl p-1 gap-1">
            <button onclick="alterarQtd('${nome}', -1)" class="w-10 h-10 flex items-center justify-center rounded-lg bg-surface-container-high text-on-surface-variant hover:bg-outline-variant transition-colors">
              <span class="material-symbols-outlined">remove</span>
            </button>
            <button onclick="alterarQtd('${nome}', 1)" class="w-10 h-10 flex items-center justify-center rounded-lg bg-primary-container text-on-primary-container hover:opacity-90 transition-colors shadow-sm">
              <span class="material-symbols-outlined">add</span>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
      atualizarTotais();
    }

    function alterarQtd(nome, delta) {
      if (contadores[nome] + delta >= 0) {
        contadores[nome] += delta;
        
        const qtdEl = document.getElementById(`qtd-${nome}`);
        const cardEl = document.getElementById(`card-${nome}`);
        
        qtdEl.innerText = contadores[nome];
        cardEl.setAttribute('data-count', contadores[nome]);

        if (contadores[nome] > 0) {
          cardEl.classList.add('card-active');
          qtdEl.classList.add('text-active');
        } else {
          cardEl.classList.remove('card-active');
          qtdEl.classList.remove('text-active');
        }

        atualizarTotais();
      }
    }

    function atualizarTotais() {
      const qtdTotal = Object.values(contadores).reduce((a, b) => a + b, 0);
      const valorTotal = qtdTotal * valorAtual;
      
      document.getElementById('lbl-qtd').innerText = qtdTotal;
      document.getElementById('lbl-valor').innerText = `R$ ${valorTotal.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    }

    function zerar() {
      if(confirm('Deseja zerar todos os contadores?')) {
        for (let k in contadores) {
          contadores[k] = 0;
          const el = document.getElementById(`qtd-${k}`);
          if (el) el.innerText = "0";
          
          const cardEl = document.getElementById(`card-${k}`);
          if (cardEl) {
            cardEl.classList.remove('card-active');
            cardEl.setAttribute('data-count', '0');
          }
          if (el) el.classList.remove('text-active');
        }
        document.getElementById('input-lote').value = '';
        atualizarTotais();
      }
    }

    function gerarTextoComprovante() {
      const agora = new Date().toLocaleString('pt-BR');
      const lote = document.getElementById('input-lote').value.trim();
      const idxConv = document.getElementById('select-convenio').value;
      
      let linhas = [];
      linhas.push("≈RESUMO ATENDIMENTOS");
      linhas.push(`Data: ${agora}`);
      linhas.push(`Tipo: ${tipoAtual.toUpperCase()}`);
      if (lote) linhas.push(`Lote: ${lote}`);
      
      if (idxConv !== "") {
        const conv = dados.convenios[tipoAtual][idxConv];
        linhas.push(`Convênio: ${conv.nome}`);
        linhas.push(`Valor Un.: R$ ${valorAtual.toFixed(2)}`);
      }

      linhas.push("─".repeat(28));
      linhas.push("Profissional           Quant.");
      linhas.push("─".repeat(28));

      let totalQtd = 0;
      const TAMANHO_LINHA = 28;
      const TAMANHO_QTD = 4;

      for (const [nome, qtd] of Object.entries(contadores)) {
        if (qtd > 0) {
          const qtdStr = qtd.toString().padStart(TAMANHO_QTD, ' ');
          const maxNomeLen = TAMANHO_LINHA - TAMANHO_QTD;

          let nomeFormatado = nome;
          if (nomeFormatado.length > maxNomeLen) {
            nomeFormatado = nomeFormatado.substring(0, maxNomeLen - 2) + "..";
          } else {
            nomeFormatado = nomeFormatado.padEnd(maxNomeLen, ' ');
          }

          linhas.push(`${nomeFormatado}${qtdStr}`);
          totalQtd += qtd;
        }
      }

      linhas.push("─".repeat(28));
      let totalValor = totalQtd * valorAtual;

      if (valorAtual > 0) {
        linhas.push(`Total: ${totalQtd} atendimentos`);
        linhas.push(`Valor Total: R$ ${totalValor.toFixed(2)}`);
      } else {
        linhas.push(`TOTAL: ${totalQtd} atendimentos`);
      }

      linhas.push("─".repeat(28));
      linhas.push("     ∙STATUS DO LOTE∙\n");
      linhas.push("►PLANILHA - ►DIGITALIZADO\n");
      linhas.push("►ENVIADO - ►ARQUIVADO\n");
      linhas.push("Ver 8.7 WebServer\n");
      linhas.push("Dev. GB - Since 02/2026");

      return linhas.join("\n");
    }

    function imprimirComprovante() {
      const texto = gerarTextoComprovante();
      const lote = document.getElementById('input-lote').value.trim();
      const container = document.getElementById('comprovante-print');
      
      container.innerText = texto;

      if (lote) {
        const qrDiv = document.createElement('div');
        qrDiv.className = 'qrcode-container';
        qrDiv.innerHTML = `<div class="qrcode-label">LOTE: ${lote}</div><div id="qrcode-target"></div>`;
        container.appendChild(qrDiv);

        new QRCode(document.getElementById("qrcode-target"), {
          text: lote,
          width: 65,
          height: 65,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      }

      setTimeout(() => {
        window.print();
      }, 250);
    }

    function salvarArquivoTXT() {
      const texto = gerarTextoComprovante();
      const blob = new Blob([texto], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `comprovante_${new Date().getTime()}.txt`;
      a.click();
    }

    window.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P')) {
        e.preventDefault();
        if (document.getElementById('tela-contador').classList.contains('active')) {
          imprimirComprovante();
        }
      }
    });

    // Inicialização da aplicação
    aplicarColunas(colunasAtuais);
    sincronizarComPlanilha();
  </script>
</body>
</html>
